<mat-sidenav-container class="layout-container">
  <mat-sidenav #sidenav mode="over">
    <nav class="menu-list">
      <a href="/">Inicio</a>
      <a href="/events">Eventos <span class="material-symbols-outlined">
      keyboard_arrow_right
      </span></a>
      <a href="/planning">Planeación <span class="material-symbols-outlined">
      keyboard_arrow_right
      </span></a>
      <a href="/petitions">Peticiones <span class="material-symbols-outlined">
      keyboard_arrow_right
      </span></a>
      <a href="/tools">Herramientas <span class="material-symbols-outlined">
      keyboard_arrow_right
      </span></a>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <!-- CONTENT -->
    <app-header (menuClick)="sidenav.toggle()"></app-header>
    <div class="page-content">
      <router-outlet />
      <button 
        class="scroll-top-btn"
        *ngIf="showScrollButton"
        (click)="scrollToTop()">
        <span class="material-symbols-outlined">keyboard_double_arrow_up</span>
      </button>
    </div>
    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="footer-grid">
        <div class="footer-item">
          <mat-icon class="footer-icon">location_on</mat-icon>
          <p class="footer-title">Location:</p>
          <p class="footer-text">Ac 116 #70C 58, Suba, Bogotá</p>
        </div>

        <div class="footer-item">
          <mat-icon class="footer-icon">chat</mat-icon>
          <p class="footer-title">Whatsapp:</p>
          <p class="footer-text">+57 319 4888854</p>
        </div>

        <div class="footer-item">
          <mat-icon class="footer-icon">email</mat-icon>
          <p class="footer-title">Email:</p>
          <p class="footer-text">parejas_jovenes@ilbd.org</p>
        </div>
      </div>
    </footer>
  </mat-sidenav-content>

</mat-sidenav-container>
