<mat-spinner *ngIf="isLoading"></mat-spinner>

<ng-container *ngIf="!isLoading && blog">
  <app-banner-image [text]="bannerText"></app-banner-image>

    <div class="post-header">
        <h1 class="post-header__title">
            {{ blog.title }}
        </h1>

        <div class="post-header__meta">
            <img
            class="post-header__avatar"
            src="{{ blog.authorImage || 'assets/avatar-placeholder.png' }}"
            alt="Foto del autor"
            />

            <div class="post-header__info">
            <span class="post-header__author">{{ blog.author }}</span>
            <span class="post-header__separator">|</span>
            <span class="post-header__reading-time">{{ readingTime }} min de lectura</span>
            <span class="post-header__separator">|</span>
            <time class="post-header__date" datetime="2019-07-30">
                {{ blog.date | date: 'longDate' }}
            </time>
            </div>
        </div>
    </div>

  <div class="blog-content" [innerHTML]="safeDescription"></div>
</ng-container>
